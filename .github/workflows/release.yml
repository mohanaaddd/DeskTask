name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Syntax check
        run: python -m py_compile DeskTask.py

      - name: Build DeskTask.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DeskTask --icon icon.ico --hidden-import pystray._win32 DeskTask.py

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\DeskTask.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DeskTask.exe" | Out-File -Encoding ascii dist\DeskTask.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: DeskTask-windows
          path: dist/DeskTask.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeskTask.exe
            dist/DeskTask.exe.sha256
          generate_release_notes: true
